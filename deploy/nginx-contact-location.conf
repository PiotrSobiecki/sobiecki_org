# Not deployed. Production runs on Railway, which exposes no Nginx we control.
# Keep for a future move to a VPS; see DEPLOYMENT.md.
# Include inside the existing HTTPS server {} for sobiecki.org.
location = /api/contact {
    limit_req zone=contact_total burst=5 nodelay;
    limit_req zone=contact_per_ip burst=2 nodelay;
    limit_req_status 429;
    client_max_body_size 40k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:3000;
    proxy_connect_timeout 5s;
    proxy_read_timeout 40s;
    proxy_request_buffering on;
}
