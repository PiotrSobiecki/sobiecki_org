# Not deployed. Production runs on Railway, which exposes no Nginx we control.
# Keep for a future move to a VPS; see DEPLOYMENT.md.
# Include in the http {} context; then include nginx-contact-location.conf
# inside the existing HTTPS virtual host (see DEPLOYMENT.md).
limit_req_zone $server_name zone=contact_total:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=contact_per_ip:10m rate=5r/m;

# Do not expose port 3000 publicly. If using another proxy/CDN in front,
# configure real_ip ONLY for its known trusted addresses, never 0.0.0.0/0.
